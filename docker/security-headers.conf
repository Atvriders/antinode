# Security headers.
#
# These live in an include rather than only at server level because of an nginx
# rule that catches everyone: add_header directives are NOT merged down. A
# location block that sets a single add_header of its own silently discards every
# add_header it would otherwise have inherited. Any location that needs its own
# header must therefore include this file as well, or it will be served with no
# content security policy at all.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# 'self' everywhere. The page draws with WebGL, which needs no extra grant, and
# loads its fonts from this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

# The microphone is offered as an opt-in way to drive the transmit chain with a
# real voice. Nothing is recorded and nothing leaves the browser, but the feature
# does need the grant, so it is allowed for this origin only.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
