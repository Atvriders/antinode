# Antinode — static hosting for a single-page application.
#
# The application is entirely self-contained: fonts are served from this origin,
# there are no analytics, no CDN and no outbound requests of any kind. The
# content security policy below says exactly that, and an end-to-end test asserts
# the running page makes no external request.

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log off;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/wasm
    image/svg+xml font/woff2;

  # Temporary paths under a directory the unprivileged user owns.
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      include /etc/nginx/security-headers.conf;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hashed assets never change under the same name.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      try_files $uri =404;
    }

    location /fonts/ {
      include /etc/nginx/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      types { font/woff2 woff2; font/ttf ttf; }
      try_files $uri =404;
    }

    # The entry point must never be cached, or a redeploy leaves people on the
    # old bundle until they hard-refresh.
    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }
  }
}
