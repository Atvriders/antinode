name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx vite build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # SwiftShader gives the runner a software WebGL2 implementation, so the
      # 3D scene really renders in CI rather than being skipped.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 7

  container:
    name: Run the container as shipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Tagged so docker-compose.yml can pull it by its normal name with TAG=ci.
      # The point of this job is to exercise the compose files people actually
      # copy, not an equivalent set of docker run flags — testing the flags
      # instead is how a container that crash-looped shipped with a green build.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/atvriders/antinode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it with docker-compose.yml, exactly as published
        env:
          TAG: ci
        run: docker compose up -d

      - name: Wait for the compose healthcheck to go healthy
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' antinode 2>/dev/null || echo missing)
            case "$state" in
              healthy) echo "healthy after ${i}s"; exit 0 ;;
              unhealthy) echo "::error::container reported unhealthy"; docker logs antinode; exit 1 ;;
            esac
            if [ "$(docker inspect -f '{{.State.Running}}' antinode 2>/dev/null)" = "false" ]; then
              echo "::error::container exited"
              docker logs antinode
              exit 1
            fi
            sleep 1
          done
          echo "::error::never became healthy"
          docker logs antinode
          exit 1

      - name: Check what it actually serves
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3042

          # The application, and the SPA fallback for a deep link.
          curl -fsS "$base/" | grep -q '<div id="root">'
          curl -fsS "$base/some/deep/link" | grep -q '<div id="root">'

          # A self-hosted font must be served, or the typography silently falls
          # back on a machine with no network.
          curl -fsS -o /dev/null "$base/fonts/chivo-mono-400.woff2"

          # Security headers on the document AND on a cached asset. nginx does
          # not merge add_header into location blocks, so the asset locations
          # are exactly where they go missing.
          asset=$(curl -fsS "$base/" | grep -o '/assets/[^"]*\.js' | head -1)
          for path in / "$asset"; do
            headers=$(curl -fsS -D - -o /dev/null "$base$path")
            for want in 'content-security-policy' 'x-content-type-options: nosniff' 'permissions-policy'; do
              echo "$headers" | grep -qi "$want" \
                || { echo "::error::missing $want on $path"; echo "$headers"; exit 1; }
            done
          done

          # It must not be running as root.
          test "$(docker exec antinode id -u)" = "10001"

      - name: Tear down
        run: docker compose down

      - name: Start it again with the hardening overlay
        env:
          TAG: ci
        run: docker compose -f docker-compose.yml -f docker-compose.hardened.yml up -d

      - name: The hardened configuration must also come up and serve
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' antinode 2>/dev/null || echo missing)
            [ "$state" = "healthy" ] && break
            if [ "$(docker inspect -f '{{.State.Running}}' antinode 2>/dev/null)" = "false" ]; then
              echo "::error::hardened container exited"
              docker logs antinode
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3042/healthz
          curl -fsS http://127.0.0.1:3042/ | grep -q '<div id="root">'

      - name: Container logs
        if: always()
        run: docker logs antinode || true
