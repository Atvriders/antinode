name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx vite build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # SwiftShader gives the runner a software WebGL2 implementation, so the
      # 3D scene really renders in CI rather than being skipped.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 7

  container:
    name: Run the container as shipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build for this runner only. The multi-architecture publish is a separate
      # workflow; what matters here is that the thing actually starts.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: antinode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Exactly the constraints docker-compose.yml applies: read-only root, a
      # tmpfs for the one writable path, no new privileges, unprivileged user.
      # A container that only starts without them is not the container people run.
      - name: Start it the way compose does
        run: |
          docker run -d --name antinode \
            --read-only \
            --tmpfs /var/cache/nginx:uid=10001,gid=10001,mode=0700 \
            --security-opt no-new-privileges:true \
            -p 8080:8080 \
            antinode:ci

      - name: Wait for it to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container never became healthy"
          docker logs antinode
          exit 1

      - name: Check what it actually serves
        run: |
          set -euo pipefail

          # The application itself, and the SPA fallback for a deep link.
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/some/deep/link | grep -q '<div id="root">'

          # A self-hosted font must be served, or the typography silently falls
          # back on a machine with no network.
          curl -fsS -o /dev/null http://127.0.0.1:8080/fonts/chivo-mono-400.woff2

          # Security headers on the document AND on a cached asset. nginx does
          # not merge add_header into location blocks, so the asset locations are
          # where they go missing.
          asset=$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          echo "checking headers on / and ${asset}"
          for path in / "${asset}"; do
            headers=$(curl -fsS -D - -o /dev/null "http://127.0.0.1:8080${path}")
            echo "${headers}" | grep -qi 'content-security-policy' \
              || { echo "::error::no CSP on ${path}"; echo "${headers}"; exit 1; }
            echo "${headers}" | grep -qi 'x-content-type-options: nosniff' \
              || { echo "::error::no nosniff on ${path}"; exit 1; }
            echo "${headers}" | grep -qi 'permissions-policy' \
              || { echo "::error::no permissions policy on ${path}"; exit 1; }
          done

          # It must not be running as root.
          test "$(docker exec antinode id -u)" = "10001"

      - name: Container logs
        if: always()
        run: docker logs antinode
